        <div class="toolbar-left">

                        <kbd>Ctrl+;</kbd>

                </div>

        <div class="toolbar-center">
            <span id="documentTitle" class="hide-on-mobile"></span>
        </div>

        <div class="toolbar-right">
            <button class="icon-button" id="toggleSearchHeader" translate="no" title="Search and replace" data-locale-attr="title:main.header.search-and-replace">search</button>

                <button class="icon-button" translate="no" onmousedown="toggleDropdown('more-menu')" title="More options" data-locale-attr="title:main.header.more-options">more_vert</button>

                        <span data-locale="main.header.more-options.open">Open</span>

                        <span data-locale="main.header.more-options.save">Save</span>

                        Share
                    </button> -->

                        <span data-locale="app.toolbar.more-menu.search-documents">Search documents</span>
                        <kbd>Ctrl+K</kbd>
                    </button> -->

                    <button class="text-button" onmouseup="closeAllDialogs(); showDialogFile('dialog/projects.html'); hideAllMenus()">

    <script>
        const workspace = document.getElementById("workspace");
        const screens = document.getElementById("screens");
        const screenA = document.getElementById("screenA");
        const screenB = document.getElementById("screenB");

        const toggleSidebarBtn = document.getElementById("toggleSidebarBtn");
        const switchModeBtn = document.getElementById("switchModeBtn");
        const splitViewBtn = document.getElementById("splitViewBtn");

        const newDocumentBtn = document.getElementById("newDocumentBtn");
        const documentTitle = document.getElementById("documentTitle");
        const renderer = document.getElementById("renderer");

        let mode = "a";
        let splitEnabled = false;
        let sidebarVisible = false;
        let selectedDirectoryId = "";
        let currentFileId = null;

        const expandedDirectories = new Set([""]);

        function render() {
            const isModeA = mode === "a";
            const isSplit = mode === "b" && splitEnabled;

            screenA.hidden = !isModeA && !isSplit;
            screenB.hidden = isModeA;
            screens.classList.toggle("mode-both", isSplit);

            screenB.classList.toggle("onSplitScreen", isSplit);

            workspace.classList.toggle("sidebar-hidden", !sidebarVisible);

            switchModeBtn.textContent = isModeA ? "import_contacts" : "edit";
            switchModeBtn.title = isModeA ? "Read" : "Edit";
            switchModeBtn.setAttribute("data-locale-attr", isModeA ? "title:main.header.switch-mode.read" : "title:main.header.switch-mode.edit");
            switchModeBtn.classList.toggle("active", mode === "b");
            translateElement(switchModeBtn);
            splitViewBtn.classList.toggle("hidden", mode !== "b");
            splitViewBtn.classList.toggle("active", splitEnabled);
        }

        toggleSidebarBtn.addEventListener("click", () => {
            toggleSidebar();
        });

        switchModeBtn.addEventListener("click", () => {
            mode = mode === "a" ? "b" : "a";
            render();
        });

        splitViewBtn.addEventListener("click", () => {
            if (mode !== "b") {
                return;
            }

            splitEnabled = !splitEnabled;
            render();
        });

        render();

        // MARK: SETTINGS
        function loadSettings() {
            // appearance
            //// theme
            const theme = Settings.getSetting("theme", "theme-auto");
            document.body.className = theme;
            //// fonts
            const root = document.documentElement;

            const editorFont = Settings.getSetting("editorFont");
            const paragraphFont = Settings.getSetting("paragraphFont");
            const titleFont = Settings.getSetting("titleFont");

            if (editorFont) root.style.setProperty("--font-editor", editorFont);
            if (paragraphFont) root.style.setProperty("--font-text", paragraphFont);
            if (titleFont) root.style.setProperty("--font-title", titleFont);

            // behavior
            if (Settings.getSetting("statusShow", "true") === "true"){
                root.style.setProperty('--status-h', '30px');
            } else { 
                root.style.setProperty('--status-h', '0px');
            }
        }

        loadSettings();

        // MARK: EDITOR
        const editor = CodeMirror.fromTextArea(document.getElementById("editor"), {
            lineNumbers: true,
            mode: "markdown",
            theme: "material-darker",
            lineWrapping: true,
            keyMap: "sublime",
            extraKeys: {
                Enter: "newlineAndIndentContinueMarkdownList",  // Pressing Enter continues markdown lists
                "Ctrl-Space": "autocomplete",                   // Trigger autocomplete with Ctrl-Space
                'Alt-Left': 'goLineStartSmart',
                'Alt-Right': 'goLineEnd',
                "Shift-Alt-Up": "addCursorToPrevLine",
                "Shift-Alt-Down": "addCursorToNextLine",
                "Alt-Up": "swapLineUp",
                "Alt-Down": "swapLineDown",
                "Ctrl-J": false, // suppress joinLines
            },
            styleActiveLine: true,
        });
        editor.focus();

        // Initialize file manager

        async function updateExtensions() { 
            await Extensions.runAll();
        }
        updateExtensions();

        async function requestPersistentStorageIfPossible() {
            const alreadyRequested = Settings.getSetting("persistentStorageRequested", "false") === "true";

            if (!navigator.storage || typeof navigator.storage.persist !== "function") {
                return;
            }

            try {
                if (typeof navigator.storage.persisted === "function") {
                    const isPersisted = await navigator.storage.persisted();
                    if (isPersisted) {
                        Settings.setSetting("persistentStorageStatus", "granted");
                        return;
                    }
                }
            } catch (error) {
                console.warn("Could not verify persistent storage state:", error);
            }

            if (alreadyRequested) {
                return;
            }

            Settings.setSetting("persistentStorageRequested", "true");

            try {
                const granted = await navigator.storage.persist();
                Settings.setSetting("persistentStorageStatus", granted ? "granted" : "denied");
            } catch (error) {
                console.warn("Error requesting persistent storage:", error);
                Settings.setSetting("persistentStorageStatus", "error");
            }
        }

        (async () => {
            await fileManager.initializeFileManager();
            await requestPersistentStorageIfPossible();
            await updateTitle();

            if (fileManager.projects.length === 0) {
                showDialogFile("dialog/projects.html", {introSequence: true});
                
                // download default extensions, if there's no projects and no extensions already installed
                const installedExtensions = await Extensions.getAll();
                if (installedExtensions.length === 0) {
                    Extensions.importFromRepoUrl("extensions/blocks.js");
                }
            }
        })();

        // MARK: STATUS BAR
        StatusBar.removeAll();

        function minPos(a, b) {
            if (a.line < b.line) return a;
            if (a.line > b.line) return b;
            return a.ch < b.ch ? a : b;
        }

        function maxPos(a, b) {
            if (a.line > b.line) return a;
            if (a.line < b.line) return b;
            return a.ch > b.ch ? a : b;
        }

        if (Settings.getSetting("statusCursorPos", "true") == "true") {
            StatusBar.register({
                id: "cursorPos",
                side: "left",

                render() {
                    return `
                        <label>
                            <span
                                data-locale="main.status-bar.cursor.single"
                                data-locale-vars='{"line":1,"col":1}'>
                                Ln 1, Col 1
                            </span>
                        </label>
                    `;
                },

                update(el) {
                    const span = el.querySelector("span");

                    const selections = editor.listSelections();
                    const cursor = editor.getCursor();

                    const cursorCount = selections.length;
                    let totalSelected = 0;

                    for (const sel of selections) {
                        const from = sel.anchor;
                        const to = sel.head;

                        if (from.line === to.line && from.ch === to.ch) continue;

                        const text = editor.getRange(
                            minPos(from, to),
                            maxPos(from, to)
                        );

                        totalSelected += text.length;
                    }

                    // single cursor
                    if (cursorCount === 1) {
                        if (totalSelected > 0) {
                            span.textContent =
                                `Ln ${cursor.line + 1}, Col ${cursor.ch + 1} (${totalSelected} Selected)`;

                            span.dataset.locale = "main.status-bar.cursor.single.selected";
                            span.dataset.localeVars = JSON.stringify({
                                line: cursor.line + 1,
                                col: cursor.ch + 1,
                                count: totalSelected
                            });
                        } else {
                            span.textContent =
                                `Ln ${cursor.line + 1}, Col ${cursor.ch + 1}`;

                            span.dataset.locale = "main.status-bar.cursor.single";
                            span.dataset.localeVars = JSON.stringify({
                                line: cursor.line + 1,
                                col: cursor.ch + 1
                            });
                        }
                    }
                    // multiple cursors
                    else {
                        if (totalSelected > 0) {
                            span.textContent =
                                `${cursorCount} Cursors (${totalSelected} Selected)`;

                            span.dataset.locale = "main.status-bar.cursor.multi.selected";
                            span.dataset.localeVars = JSON.stringify({
                                count: cursorCount,
                                selected: totalSelected
                            });
                        } else {
                            span.textContent =
                                `${cursorCount} Cursors`;

                            span.dataset.locale = "main.status-bar.cursor.multi";
                            span.dataset.localeVars = JSON.stringify({
                                count: cursorCount
                            });
                        }
                    }

                    translateElement(span);
                }
            });

            editor.on("cursorActivity", () => StatusBar.update("cursorPos"));
        }

        if (Settings.getSetting("statusDocumentSize", "true") == "true") {
            StatusBar.register({
                id: "docSize",
                side: "right",

                render() {
                    return `<label><span>0 <span data-locale="app.status-bar-document-size.characters">Characters</span>, 0 <span data-locale="app.status-bar-document-size.words">Words</span></span></label>`;
                },

                update(el) {
                    const content = editor.getValue();
                    const chars = content.length;
                    const words = content.trim().split(/\s+/).filter(Boolean).length;

                    el.querySelector("label").innerHTML =
                        `<span>${chars} <span data-locale="app.status-bar-document-size.characters">Characters</span>, ${words} <span data-locale="app.status-bar-document-size.words">Words</span></span>`;

                    translateWithin(el.querySelector("label"))
                }
            });

            editor.on("keyHandled", () => StatusBar.update("docSize"));
            editor.on("change", () => StatusBar.update("docSize"));
        }

        // MARK: RENDERER
        const converter = new showdown.Converter({
            extensions: ["scriptExecutionButton", "mediaRenderer", "blocks"],
        });

        converter.setOption('ghCompatibleHeaderId', true);
        converter.setOption('parseImgDimensions', true);
        converter.setOption('simplifiedAutoLink', true);
        converter.setOption('literalMidWordUnderscores', true);
        converter.setOption('strikethrough', true);
        converter.setOption('tables', true);
        converter.setOption('tasklists', true);
        converter.setOption('smoothLivePreview', true);
        converter.setOption('requireSpaceBeforeHeadingText', true);
        converter.setOption('openLinksInNewWindow', true);
        converter.setOption('backslashEscapesHTMLTags', true);
        converter.setOption('emoji', true);
        converter.setOption('underline', true);
        converter.setOption('metadata', true);
        converter.setOption('splitAdjacentBlockquotes', true);
        converter.setOption('moreStyling', true);
        converter.setOption('imageTitleAsLegend', true);

        let updateTimeout;
        let rendererResourceUrls = [];

        function revokeRendererResourceUrls() {
            for (const url of rendererResourceUrls) {
                URL.revokeObjectURL(url);
            }
            rendererResourceUrls = [];
        }

        function looksLikeResourcePath(pathValue = "") {
            const value = String(pathValue || "").trim();
            return /^(?:\.\/)?resources\//i.test(value);
        }

        function getMimeTypeByFileName(fileName = "") {
            const lowerName = String(fileName || "").toLowerCase();

            if (lowerName.endsWith(".apng")) return "image/apng";
            if (lowerName.endsWith(".avif")) return "image/avif";
            if (lowerName.endsWith(".gif")) return "image/gif";
            if (lowerName.endsWith(".jpg") || lowerName.endsWith(".jpeg") || lowerName.endsWith(".jfif") || lowerName.endsWith(".pjpeg") || lowerName.endsWith(".pjp")) return "image/jpeg";
            if (lowerName.endsWith(".png")) return "image/png";
            if (lowerName.endsWith(".svg")) return "image/svg+xml";
            if (lowerName.endsWith(".webp")) return "image/webp";

            if (lowerName.endsWith(".webm")) return "video/webm";
            if (lowerName.endsWith(".mp4")) return "video/mp4";

            if (lowerName.endsWith(".ogg")) return "audio/ogg"; // could be audio or video, but we'll assume audio since it's more common
            if (lowerName.endsWith(".wav")) return "audio/wav";
            if (lowerName.endsWith(".mp3")) return "audio/mpeg";

            if (lowerName.endsWith(".pdf")) return "application/pdf";
            if (lowerName.endsWith(".json")) return "application/json";
            if (lowerName.endsWith(".txt") || lowerName.endsWith(".md")) return "text/plain";

            return "application/octet-stream";
        }

        // This function finds all media/link elements in the renderer that have src or href attributes pointing to resources,
        // reads those resources from the file system, creates object URLs for them, and updates the elements to use those object URLs.
        // It also keeps track of the created object URLs so they can be revoked later to free up memory.
        // Additionally, it processes custom media elements created by MediaRendererRegistry BEFORE blob URLs are created.
        async function resolveRendererResourcePaths() {
            revokeRendererResourceUrls();

            if (!fileManager.currentProjectId) {
                return;
            }

            // FIRST: Process custom media elements to use original paths
            // This must be done BEFORE we replace src attributes with blob URLs
            const customMediaElements = renderer.querySelectorAll("[data-custom-media='true']");

            for (const element of customMediaElements) {
                const handlerName = element.getAttribute("data-media-handler");
                const originalSrc = element.getAttribute("data-original-src");
                
                if (!handlerName || !originalSrc) continue;

                // Collect all attributes except internal data attributes
                const attributes = {};
                for (const attr of element.attributes) {
                    if (!attr.name.startsWith("data-")) {
                        attributes[attr.name] = attr.value;
                    }
                }

                // Set src to the original path (not the blob URL)
                attributes.src = originalSrc;

                try {
                    // Try to read the file and pass it to the handler
                    if (looksLikeResourcePath(originalSrc)) {
                        const relativeResourcePath = originalSrc
                            .replace(/^\.\//, "")
                            .replace(/^resources\//i, "")
                            .split("?")[0]
                            .split("#")[0];
                        const decodedResourcePath = decodeURIComponent(relativeResourcePath);

                        if (decodedResourcePath) {
                            const resourceId = `${fileManager.currentProjectId}/resources/${decodedResourcePath}`;
                            const resourceEntry = await file.readFile(resourceId);

                            if (resourceEntry && resourceEntry.type === "file") {
                                // Pass the file content/blob to the handler
                                attributes.fileContent = resourceEntry.content;
                                attributes.fileName = resourceEntry.name;
                            }
                        }
                    }

                    // Call the handler to render the element
                    const html = await MediaRendererRegistry.render(handlerName, attributes);

                    if (html) {
                        // Create a temporary container to parse the HTML safely
                        const temp = document.createElement("div");
                        temp.innerHTML = html;
                        
                        // Replace the element with the handler's output
                        element.replaceWith(...temp.childNodes);
                    }
                } catch (error) {
                    console.error(`Error processing custom media handler "${handlerName}":`, error);
                }
            }

            // SECOND: Process regular media/link elements and create blob URLs
            const candidates = [
                ...renderer.querySelectorAll("img[src]"),
                ...renderer.querySelectorAll("video[src]"),
                ...renderer.querySelectorAll("audio[src]"),
                ...renderer.querySelectorAll("a[href]")
            ];

            for (const element of candidates) {
                const attributeName = element.tagName === "A" ? "href" : "src";
                const originalPath = element.getAttribute(attributeName) || "";

                if (!looksLikeResourcePath(originalPath)) {
                    continue;
                }

                const relativeResourcePath = originalPath
                    .replace(/^\.\//, "")
                    .replace(/^resources\//i, "")
                    .split("?")[0]
                    .split("#")[0];
                const decodedResourcePath = decodeURIComponent(relativeResourcePath);

                if (!decodedResourcePath) {
                    continue;
                }

                const resourceId = `${fileManager.currentProjectId}/resources/${decodedResourcePath}`;
                const resourceEntry = await file.readFile(resourceId);

                if (!resourceEntry || resourceEntry.type !== "file") {
                    continue;
                }

                const blob = resourceEntry.content instanceof Blob
                    ? resourceEntry.content
                    : new Blob([resourceEntry.content], { type: getMimeTypeByFileName(resourceEntry.name) });

                const objectUrl = URL.createObjectURL(blob);
                rendererResourceUrls.push(objectUrl);
                element.setAttribute(attributeName, objectUrl);
            }
        }

        editor.on("change", () => {
            
            clearTimeout(updateTimeout);
            updateTimeout = setTimeout(async () => {
                const markdownText = editor.getValue();
                const html = converter.makeHtml(markdownText);
                renderer.innerHTML = html;
                await resolveRendererResourcePaths();
                
                // Autosave the current file
                fileManager.autosaveCurrentFile();
                updateTitle();
            }, 500);
        });

        window.addEventListener("beforeunload", revokeRendererResourceUrls);

        async function updateTitle() {
            if (!fileManager.currentProjectId) {
                documentTitle.innerHTML = "";
                document.title = "Cohesion";
                return;
            }

            const projectLabel = fileManager.currentProjectId.split("/").pop();
            const title = await file.getTitleFromMarkdownContent(editor.getValue());
            // documentTitle.innerHTML = projectLabel + "/" + (title || "New document");
            documentTitle.innerHTML = `<span class="file-title">${title || "New document"}</span> <span class="project-label">${projectLabel}</span>`;
            document.title = `${title} - Cohesion`;
            return;
        }

        // MARK: Keyboard shortcuts
        // File
        //// ctrl+s save file
        document.addEventListener("keydown", (event) => {
            if (event.ctrlKey && event.key === "s") {
                event.preventDefault();
                saveCurrentFile();
            }
        });
        // View
        //// ctrl+p switch between the three view modes (editor, renderer, split)
        document.addEventListener("keydown", (event) => {
            if (event.ctrlKey && event.key === "p") {
                event.preventDefault();
                if (mode === "a") {
                    mode = "b";
                    splitEnabled = false;
                } else if (mode === "b" && !splitEnabled) {
                    splitEnabled = true;
                } else {
                    mode = "a";
                    splitEnabled = false;
                }
                render();
                editor.focus();
            }
        });
        //// ctrl+' toggle sidebar
        document.addEventListener("keydown", (event) => {
            if (event.ctrlKey && event.key === "'") {
                event.preventDefault();
                toggleSidebar();
            }
        });
        //// esc focus editor
        document.addEventListener("keydown", (event) => {
            if (event.key === "Escape") {
                editor.focus();
                if (mode === "b" && !splitEnabled) {
                    mode = "a";
                    render();
                }
            }
        });
        // Format
        //// ctrl+b bold
        document.addEventListener("keydown", (event) => {
            if (event.ctrlKey && event.key === "b") {
                event.preventDefault();
                insert.wrap("**", "**", "Bold text");
            }
        });
        //// ctrl+i italic
        document.addEventListener("keydown", (event) => {
            if (event.ctrlKey && event.key === "i") {
                event.preventDefault();
                insert.wrap("*", "*", "Italic text");
            }
        });
        // Insert
        //// F6 insert date and time
        document.addEventListener("keydown", (event) => {
            if (event.key === "F6") {
                event.preventDefault();
                insert.atCursor(strftime(Settings.getSetting('timeFormatting', '%d/%m/%Y %H:%M')), true);
            }
        });
        // Misc
        //// F1 open about dialog
        document.addEventListener("keydown", (event) => {
            if (event.key === "F1") {
                event.preventDefault();
                closeAllDialogs();
                showDialogFile('dialog/about.html');
            }
        });
        //// Ctrl+, open settings
        document.addEventListener("keydown", (event) => {
            if (event.ctrlKey && event.key === ",") {
                event.preventDefault();
                closeAllDialogs();
                showDialogFile('dialog/settings.html');
            }
        });
        //// Ctrl+J open projects dialog
        document.addEventListener("keydown", (event) => {
            if (event.ctrlKey && event.key === "j") {
                event.preventDefault();
                closeAllDialogs();
                showDialogFile('dialog/projects.html');
            }
        });
        //// Ctrl+Ç test shortcut that will be removed at some point
        document.addEventListener("keydown", async (event) => {
            if (event.ctrlKey && event.key === "ç") {
                const n = await Extensions.getAll();
                console.log(n.length);
            }
        });

        function toggleSidebar(show = "auto") {
            if (show === "auto") {
                sidebarVisible = !sidebarVisible;
            } else if (show === "true") {
                sidebarVisible = true;
            } else {
                sidebarVisible = false;
            }

            Settings.setSetting("sidebarVisible", sidebarVisible);
            
            render();
        }

        toggleSidebar(Settings.getSetting("sidebarVisible", "true"));

        async function saveCurrentFile() {
            if (!fileManager.currentProjectId || !fileManager.currentFileId) {
                Toast.show("Open a project and select a file first", "warning");
                return;
            }

            const title = await file.getMarkdownTitle(fileManager.currentFileId);
            showDialogFile('dialog/saveFileDialog.html', {filename: title || "New document"});
        }
    </script>
</body>

</html>
