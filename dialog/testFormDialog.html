<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>test!!</title>
    <meta name="dialog-preferred-width" content="600">
</head>
<body>
    <hr class="toolbar-spacer">
    <form id="testForm" class="padding">
        <div>
            <label for="input1">text input:</label>
            <input id="input1" name="input1" type="text" autocomplete="off" autofocus placeholder="Enter text here..." >
        </div> 
        <div>
            <label for="input2">Password input:</label>
            <input id="input2" name="input2" type="password" autocomplete="off" placeholder="Enter password here..." >
        </div>
        <div>
            <label for="input3">Email input:</label>
            <input id="input3" name="input3" type="email" autocomplete="off" placeholder="Enter email here..." >
        </div>
        <div>
            <label for="input4">Number input:</label>
            <input id="input4" name="input4" type="number" autocomplete="off" placeholder="Enter number here..." >
        </div>
        <div>
            <label for="input5">Date input:</label>
            <input id="input5" name="input5" type="date" autocomplete="off" placeholder="Enter date here..." >
        </div>
        <div>
            <label for="input6">Time input:</label>
            <input id="input6" name="input6" type="time" autocomplete="off" placeholder="Enter time here..." >
        </div>
        <div>
            <label for="input7">Color input:</label>
            <input id="input7" name="input7" type="color" autocomplete="off" placeholder="Enter color here..." >
        </div>
        <div>
            <label for="input8">Range input:</label>
            <input id="input8" name="input8" type="range" autocomplete="off" placeholder="Enter range here..." >
        </div>
        <div class="button-group">
            <button type="submit" class="text-button primary">Confirm</button>
            <button type="button" class="text-button" id="cancelButton">Cancel</button>
        </div>
    </form>
</body>
</html>
