<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="dialog-preferred-width" content="520">
    <meta name="dialog-toolbar-overlay" content="false">
    <meta name="dialog-toolbar-center" content="<span data-locale='dialogs.project-editor.title.edit-project'>Edit project</span>">
    <style>
        .icon-grid {
            display: flex;
            gap: 8px;
            width: 100%;
            overflow-x: scroll;
            padding: 0px 8px 0px 8px;
            -ms-overflow-style: none;  /* Hide scrollbar for Internet Explorer and Edge */
            scrollbar-width: none;  /* Hide scrollbar for Firefox */
        }

        .icon-grid::-webkit-scrollbar {
            display: none; /* Hide scrollbar for WebKit browsers */
        }

        .icon-grid .icon-option {
            height: 48px;
            min-width: 48px;
            width: 48px;
            border-radius: 8px;
            background-color: var(--background-color-3);
            transition: background-color 0.2s, color 0.2s;
        }

        .icon-grid .icon-option:hover {
            background-color: var(--hover-color);
        }

        .icon-grid .icon-option.selected {
            background-color: var(--accent);
            color: var(--button-color-2);
        }

        .color-grid {
            display: flex;
            gap: 8px;
            width: 100%;
            align-items: center;
            justify-content: center;
        }

        .color-grid .color-option {
            height: 32px;
            min-width: 32px;
            width: 32px;
            border-radius: 16px;
            border: none;
            transition: width 0.2s ease-in-out, outline 0.2s, outline-offset 0.2s;
            outline: 4px solid var(--background-color-2);
            outline-offset: -3px;
        }
        
        .color-grid .color-option:hover {
            outline: 0px solid var(--background-color-2);
            outline-offset: 0px;
        }
        
        .color-grid .color-option:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 0px;
        }
        
        .color-grid .color-option.selected {
            width: 80px;
            outline: 0px solid var(--background-color-2);
            outline-offset: 0px;
        }

        .color-grid .color-option.selected:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 0px;
        }
    </style>
</head>
<body>
    <main class="padding">
        <section>
            <div class="row">
                <label for="project-name" data-locale="dialogs.project-editor.project-name">Project name</label>
                <input type="text" id="project-name" maxlength="64" required>
            </div>
        </section>
        <section>
            <div class="row" style="padding: 8px 0px 8px 0px; overflow: hidden;">
                <div id="project-icon-grid" class="icon-grid" role="radiogroup" aria-label="Project icon">
                    <button type="button" class="icon-button icon-option" translate="no" data-icon="folder"       aria-label="folder"       title="Folder"       data-locale-attr="title:dialogs.project-editor.icon.folder">folder</button>
                    <button type="button" class="icon-button icon-option" translate="no" data-icon="draft"        aria-label="draft"        title="Draft"        data-locale-attr="title:dialogs.project-editor.icon.draft">draft</button>
                    <button type="button" class="icon-button icon-option" translate="no" data-icon="bookmark"     aria-label="bookmark"     title="Bookmark"     data-locale-attr="title:dialogs.project-editor.icon.bookmark">bookmark</button>
                    <button type="button" class="icon-button icon-option" translate="no" data-icon="star"         aria-label="star"         title="Star"         data-locale-attr="title:dialogs.project-editor.icon.star">star</button>
                    <button type="button" class="icon-button icon-option" translate="no" data-icon="flag"         aria-label="flag"         title="Flag"         data-locale-attr="title:dialogs.project-editor.icon.flag">flag</button>
                    <button type="button" class="icon-button icon-option" translate="no" data-icon="palette"      aria-label="palette"      title="Palette"      data-locale-attr="title:dialogs.project-editor.icon.palette">palette</button>
                    <button type="button" class="icon-button icon-option" translate="no" data-icon="code"         aria-label="code"         title="Code"         data-locale-attr="title:dialogs.project-editor.icon.code">code</button>
                    <button type="button" class="icon-button icon-option" translate="no" data-icon="settings"     aria-label="settings"     title="Settings"     data-locale-attr="title:dialogs.project-editor.icon.settings">settings</button>
                    <button type="button" class="icon-button icon-option" translate="no" data-icon="home"         aria-label="home"         title="Home"         data-locale-attr="title:dialogs.project-editor.icon.home">home</button>
                    <button type="button" class="icon-button icon-option" translate="no" data-icon="work"         aria-label="work"         title="Work"         data-locale-attr="title:dialogs.project-editor.icon.work">work</button>
                    <button type="button" class="icon-button icon-option" translate="no" data-icon="school"       aria-label="school"       title="School"       data-locale-attr="title:dialogs.project-editor.icon.school">school</button>
                    <button type="button" class="icon-button icon-option" translate="no" data-icon="shopping_bag" aria-label="shopping_bag" title="Shopping Bag" data-locale-attr="title:dialogs.project-editor.icon.shopping-bag">shopping_bag</button>
                    <button type="button" class="icon-button icon-option" translate="no" data-icon="travel"       aria-label="travel"       title="Travel"       data-locale-attr="title:dialogs.project-editor.icon.travel">travel</button>
                </div>
            </div>
            <div class="row">
                <div id="project-color-grid" class="color-grid" role="radiogroup" aria-label="Project color">
                    <button type="button" class="color-option" data-color="var(--text-color)"   aria-label="var(--text-color)"   title="Text color" data-locale-attr="title:dialogs.project-editor.color.text-color" style="background-color: var(--text-color);"></button>
                    <button type="button" class="color-option" data-color="var(--color-red)"    aria-label="var(--color-red)"    title="Red"        data-locale-attr="title:dialogs.project-editor.color.red"        style="background-color: var(--color-red);"></button>
                    <button type="button" class="color-option" data-color="var(--color-orange)" aria-label="var(--color-orange)" title="Orange"     data-locale-attr="title:dialogs.project-editor.color.orange"     style="background-color: var(--color-orange);"></button>
                    <button type="button" class="color-option" data-color="var(--color-yellow)" aria-label="var(--color-yellow)" title="Yellow"     data-locale-attr="title:dialogs.project-editor.color.yellow"     style="background-color: var(--color-yellow);"></button>
                    <button type="button" class="color-option" data-color="var(--color-green)"  aria-label="var(--color-green)"  title="Green"      data-locale-attr="title:dialogs.project-editor.color.green"      style="background-color: var(--color-green);"></button>
                    <button type="button" class="color-option" data-color="var(--color-blue)"   aria-label="var(--color-blue)"   title="Blue"       data-locale-attr="title:dialogs.project-editor.color.blue"       style="background-color: var(--color-blue);"></button>
                    <button type="button" class="color-option" data-color="var(--color-purple)" aria-label="var(--color-purple)" title="Purple"     data-locale-attr="title:dialogs.project-editor.color.purple"     style="background-color: var(--color-purple);"></button>
                    <button type="button" class="color-option" data-color="var(--color-pink)"   aria-label="var(--color-pink)"   title="Pink"       data-locale-attr="title:dialogs.project-editor.color.pink"       style="background-color: var(--color-pink);"></button>
                </div>
            </div>
        </section>

        <section class="button-row">
            <button class="text-button" type="button" id="project-cancel" data-locale="common.cancel">Cancel</button>
            <button class="text-button primary" type="button" id="project-confirm" data-locale="common.save">Save</button>
        </section>
    </main>

    <script>
        (() => {
            const args = typeof window.dialogArgs === "function" ? window.dialogArgs() : {};
            const initialData = args.initialData && typeof args.initialData === "object" ? args.initialData : {};

            const projectNameInput = document.getElementById("project-name");
            const iconGrid = document.getElementById("project-icon-grid");
            const iconButtons = Array.from(iconGrid.querySelectorAll(".icon-option"));
            const availableIcons = new Set(iconButtons.map((button) => button.dataset.icon));
            const colorGrid = document.getElementById("project-color-grid");
            const colorButtons = Array.from(colorGrid.querySelectorAll(".color-option"));
            const availableColors = new Set(colorButtons.map((button) => button.dataset.color));

            setHorizontalScroll(iconGrid, true);

            const scrollToSelectedIcon = () => {
                const selectedButton = iconGrid.querySelectorAll(".icon-option.selected")[0];
                if (selectedButton) {
                    const buttonRect = selectedButton.getBoundingClientRect();
                    const gridRect = iconGrid.getBoundingClientRect();
                    const offset = buttonRect.left - gridRect.left - (gridRect.width / 2) + (buttonRect.width / 2);
                    iconGrid.scrollBy({ left: offset, behavior: "smooth" });
                }
            };

            scrollToSelectedIcon();

            projectNameInput.value = String(initialData.name || getTranslation("dialogs.projects.new-project", "New Project"));

            if (initialData.name === "") {
                updateDialogToolbarCenter("<span data-locale='dialogs.project-editor.title.new-project'>New project</span>")
            }

            let selectedIcon = String(initialData.icon || "folder");
            if (!availableIcons.has(selectedIcon)) {
                selectedIcon = "folder";
            }

            const updateSelectedIcon = (iconName) => {
                selectedIcon = iconName;
                iconButtons.forEach((button) => {
                    const isSelected = button.dataset.icon === iconName;
                    button.classList.toggle("selected", isSelected);
                    button.setAttribute("aria-pressed", String(isSelected));
                });
                scrollToSelectedIcon();
            };

            iconButtons.forEach((button) => {
                button.addEventListener("click", () => {
                    updateSelectedIcon(button.dataset.icon);
                });
                button.addEventListener("dblclick", () => {
                    updateSelectedIcon(button.dataset.icon);
                    document.getElementById("project-confirm").click();
                });
            });

            updateSelectedIcon(selectedIcon);

            let selectedColor = String(initialData.color || "var(--text-color)");
            if (!availableColors.has(selectedColor)) {
                selectedColor = "var(--text-color)";
            }

            const updateSelectedColor = (colorValue) => {
                selectedColor = colorValue;
                colorButtons.forEach((button) => {
                    const isSelected = button.dataset.color === colorValue;
                    button.classList.toggle("selected", isSelected);
                    button.setAttribute("aria-pressed", String(isSelected));
                });
            };

            colorButtons.forEach((button) => {
                button.addEventListener("click", () => {
                    updateSelectedColor(button.dataset.color);
                });
                button.addEventListener("dblclick", () => {
                    updateSelectedColor(button.dataset.color);
                    document.getElementById("project-confirm").click();
                });
            });

            updateSelectedColor(selectedColor);

            const confirmText = typeof args.confirmText === "string" && args.confirmText.trim() ? args.confirmText : getTranslation("common.save", "Save");
            document.getElementById("project-confirm").textContent = confirmText;

            document.getElementById("project-cancel").addEventListener("click", () => {
                window.dialogCancel(null);
            });

            document.getElementById("project-confirm").addEventListener("click", () => {
                const payload = {
                    name: projectNameInput.value.trim(),
                    icon: selectedIcon,
                    color: selectedColor,
                };

                if (!payload.name) {
                    Toast.show("Project name is required", "warning");
                    projectNameInput.focus();
                    return;
                }

                window.dialogReturn(payload);
            });

            projectNameInput.focus();
            projectNameInput.select();

            projectNameInput.addEventListener("keydown", (e) => {
                if (e.key === "Enter") {
                    e.preventDefault();
                    document.getElementById("project-confirm").click();
                }
            });
        })();
    </script>
</body>
</html>
