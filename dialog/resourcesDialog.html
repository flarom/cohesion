<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="dialog-prefered-width" content="760">
    <meta name="dialog-prefered-height" content="520">
    <meta name="dialog-toolbar-center" content="<span>Project resources</span>">
    <style>
        dialog .resources-layout {
            display: grid;
            grid-template-columns: minmax(260px, 1fr) minmax(240px, 320px);
            gap: 14px;
            height: calc(100% - 18px);
            padding: 12px;
        }

        dialog .resource-list {
            border: 1px solid var(--border-light-color);
            border-radius: 10px;
            overflow: auto;
        }

        dialog .resource-item {
            width: 100%;
            border: none;
            background: transparent;
            color: var(--text-color);
            text-align: left;
            padding: 10px 12px;
            display: flex;
            justify-content: space-between;
            gap: 10px;
        }

        dialog .resource-item:hover,
        dialog .resource-item.active {
            background: var(--selection-color);
        }

        dialog .resources-sidebar {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        dialog .preview-box {
            border: 1px solid var(--border-light-color);
            border-radius: 10px;
            min-height: 180px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px;
            overflow: hidden;
        }

        dialog .preview-box img {
            max-width: 100%;
            max-height: 220px;
            object-fit: contain;
        }

        dialog .button-stack {
            display: grid;
            gap: 8px;
        }

        @media (max-width: 700px) {
            dialog .resources-layout {
                display: block;
                overflow: auto;
            }

            dialog .resources-sidebar {
                margin-top: 12px;
            }
        }
    </style>
</head>
<body>
    <hr class="toolbar-spacer">
    <div class="resources-layout">
        <section class="resource-list" id="resource-list"></section>

        <aside class="resources-sidebar">
            <div class="preview-box" id="preview-box">No file selected</div>
            <div class="button-stack">
                <button class="text-button" id="upload-resource-btn">Upload files</button>
                <button class="text-button" id="insert-link-btn">Insert markdown link</button>
                <button class="text-button" id="download-resource-btn">Download selected</button>
                <button class="text-button danger" id="delete-resource-btn">Delete selected</button>
            </div>
        </aside>
    </div>

    <script>
        (() => {
            const args = typeof window.dialogArgs === "function" ? window.dialogArgs() : {};
            const projectId = String(args.projectId || fileManager.currentProjectId || "").trim();
            const resourcesPath = projectId ? `${projectId}/resources` : "";

            const resourceList = document.getElementById("resource-list");
            const previewBox = document.getElementById("preview-box");

            let selectedResource = null;
            let resources = [];
            let previewUrl = null;

            const clearPreview = () => {
                if (previewUrl) {
                    URL.revokeObjectURL(previewUrl);
                    previewUrl = null;
                }
            };

            const isImageName = (name) => /\.(png|jpe?g|gif|webp|svg|bmp|ico)$/i.test(String(name || ""));

            const getUniqueResourceName = (baseName) => {
                const normalizedName = String(baseName || "resource").trim() || "resource";
                const dotIndex = normalizedName.lastIndexOf(".");
                const base = dotIndex > 0 ? normalizedName.slice(0, dotIndex) : normalizedName;
                const ext = dotIndex > 0 ? normalizedName.slice(dotIndex) : "";

                const names = new Set(resources.map((entry) => entry.name.toLowerCase()));
                if (!names.has(normalizedName.toLowerCase())) {
                    return normalizedName;
                }

                let counter = 1;
                while (true) {
                    const candidate = `${base} (${counter})${ext}`;
                    if (!names.has(candidate.toLowerCase())) {
                        return candidate;
                    }
                    counter += 1;
                }
            };

            const renderPreview = async () => {
                clearPreview();

                if (!selectedResource) {
                    previewBox.innerHTML = "No file selected";
                    return;
                }

                if (!isImageName(selectedResource.name)) {
                    previewBox.innerHTML = "Preview available for images only";
                    return;
                }

                if (selectedResource.content instanceof Blob) {
                    previewUrl = URL.createObjectURL(selectedResource.content);
                } else {
                    const blob = new Blob([selectedResource.content], { type: "image/*" });
                    previewUrl = URL.createObjectURL(blob);
                }

                previewBox.innerHTML = `<img src="${previewUrl}" alt="${selectedResource.name}">`;
            };

            const renderList = () => {
                resourceList.innerHTML = "";

                if (resources.length === 0) {
                    resourceList.innerHTML = "<p class='padding'>No files in resources.</p>";
                    selectedResource = null;
                    renderPreview();
                    return;
                }

                for (const entry of resources) {
                    const button = document.createElement("button");
                    button.className = "resource-item" + (selectedResource && selectedResource.id === entry.id ? " active" : "");
                    button.innerHTML = `
                        <span>${entry.name}</span>
                        <span>${entry.content instanceof Blob ? `${Math.ceil(entry.content.size / 1024)} KB` : "Text"}</span>
                    `;

                    button.addEventListener("click", async () => {
                        selectedResource = await file.readFile(entry.id);
                        renderList();
                        renderPreview();
                    });

                    resourceList.appendChild(button);
                }
            };

            const loadResources = async () => {
                if (!projectId) {
                    resourceList.innerHTML = "<p class='padding'>Open a project first.</p>";
                    return;
                }

                await file.ensureDirectoryExistsById(resourcesPath);
                resources = await file.listDirectory(resourcesPath, true);
                resources = resources.filter((entry) => entry.type === "file").sort((a, b) => a.name.localeCompare(b.name));

                if (selectedResource) {
                    selectedResource = resources.find((entry) => entry.id === selectedResource.id) || null;
                }

                renderList();
                await renderPreview();
            };

            document.getElementById("upload-resource-btn").addEventListener("click", () => {
                const input = document.createElement("input");
                input.type = "file";
                input.multiple = true;
                input.onchange = async () => {
                    const files = Array.from(input.files || []);
                    if (files.length === 0) {
                        return;
                    }

                    for (const selectedFile of files) {
                        const uniqueName = getUniqueResourceName(selectedFile.name);
                        await file.createFile(uniqueName, selectedFile, resourcesPath);
                    }

                    await loadResources();
                    Toast.show("Resource uploaded", "check");
                };
                input.click();
            });

            document.getElementById("insert-link-btn").addEventListener("click", () => {
                if (!selectedResource) {
                    Toast.show("Select a resource first", "warning");
                    return;
                }

                const altText = selectedResource.name.replace(/\.[^/.]+$/, "");
                insert.atCursor(`![${altText}](resources/${selectedResource.name})`, true);
                editor.focus();
            });

            document.getElementById("delete-resource-btn").addEventListener("click", async () => {
                if (!selectedResource) {
                    Toast.show("Select a resource first", "warning");
                    return;
                }

                const confirmed = await showConfirmDialog({
                    message: `Delete resource \"${selectedResource.name}\"?`,
                    detail: "The file will be permanently removed from this project.",
                    confirmButtonDestructive: true,
                    confirmButtonText: "Delete",
                    denyButtonText: "Cancel"
                });

                if (!confirmed) {
                    return;
                }

                await file.removeFile(selectedResource.id);
                selectedResource = null;
                await loadResources();
                Toast.show("Resource deleted", "delete");
            });

            document.getElementById("download-resource-btn").addEventListener("click", async () => {
                if (!selectedResource) {
                    Toast.show("Select a resource first", "warning");
                    return;
                }

                const latest = await file.readFile(selectedResource.id);
                if (!latest || latest.type !== "file") {
                    Toast.show("Could not read selected resource", "error");
                    return;
                }

                const blob = latest.content instanceof Blob ? latest.content : new Blob([latest.content], { type: "application/octet-stream" });
                const url = URL.createObjectURL(blob);
                const anchor = document.createElement("a");
                anchor.href = url;
                anchor.download = latest.name;
                document.body.appendChild(anchor);
                anchor.click();
                document.body.removeChild(anchor);
                URL.revokeObjectURL(url);
            });

            loadResources();
            window.addEventListener("beforeunload", clearPreview);
        })();
    </script>
</body>
</html>
