<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>table</title>
    <meta name="dialog-prefered-width" content="330">
    <meta name="dialog-toolbar-center" content="<span>0 x 0</span>">
    <meta name="dialog-toolbar-overlay" content="false">
    <style>
        #tableSelector {
            display: grid;
            grid-template-columns: repeat(6, 48px);
            grid-template-rows: repeat(4, 48px);
            gap: 4px;
            padding: 0px 10px 10px 10px;
            justify-content: center;
            perspective: 800px;

            .table-item {
                background: var(--background-color-2);
                border-radius: 0px;
                transition: 0.3s;
                border: 1px solid var(--border-field-color);
                transition: border 0s, background 0s 0.2s, border 0s 0.2s, transform 0.5s, border-radius 0.5s;
            }

            .table-item.highlighted {
                background: var(--accent);
                border: 1px solid var(--accent);
                transform: rotateY(180deg);
            }

            .table-item:first-child {
                border-top-left-radius: 10px;
            }
            .table-item.highlighted:first-child {
                border-top-left-radius: 0px;
                border-top-right-radius: 10px;
            }

            .table-item:nth-child(6) {
                border-top-right-radius: 10px;
            }
            .table-item.highlighted:nth-child(6) {
                border-top-right-radius: 0px;
                border-top-left-radius: 10px;
            }

            .table-item:nth-child(19) {
                border-bottom-left-radius: 10px;
            }
            .table-item.highlighted:nth-child(19) {
                border-bottom-left-radius: 0px;
                border-bottom-right-radius: 10px;
            }

            .table-item:nth-child(24) {
                border-bottom-right-radius: 10px;
            }
            .table-item.highlighted:nth-child(24) {
                border-bottom-right-radius: 0px;
                border-bottom-left-radius: 10px;
            }
        }
    </style>
</head>
<body>
    <div id="tableSelector"></div>
    <script>
        (() => {
            const tableContainer = document.getElementById("tableSelector");

            const rows = 4;
            const cols = 6;
            const cellSpaces = 10;

            const buttons = [];

            for (let row = 0; row < rows; row++) {
                for (let col = 0; col < cols; col++) {
                    const btn = document.createElement("button");
                    btn.className = "table-item";
                    btn.dataset.row = row + 1;
                    btn.dataset.col = col + 1;
                    tableContainer.appendChild(btn);
                    buttons.push(btn);
                }
            }
            tableContainer.addEventListener("mouseover", (e) => {
                if (!e.target.classList.contains("table-item")) return;

                const targetRow = parseInt(e.target.dataset.row);
                const targetCol = parseInt(e.target.dataset.col);

                buttons.forEach((btn) => {
                    const r = parseInt(btn.dataset.row);
                    const c = parseInt(btn.dataset.col);
                    btn.classList.toggle("highlighted", r <= targetRow && c <= targetCol);
                });

                updateDialogToolbarCenter(`<span>${targetRow} x ${targetCol}</span>`);
            });
            tableContainer.addEventListener("click", (e) => {
                if (!e.target.classList.contains("table-item")) return;

                const rowCount = parseInt(e.target.dataset.row);
                const colCount = parseInt(e.target.dataset.col);

                // window.dialogReturn({ rows: rowCount, cols: colCount });

                // construct empty markdown table
                let tableMarkdown = "";
                //// header
                tableMarkdown += "|";
                for (let c = 0; c < colCount; c++) {
                    tableMarkdown += " ".repeat(cellSpaces) + "|";
                }
                tableMarkdown += "\n";

                //// separator
                tableMarkdown += "|";
                for (let c = 0; c < colCount; c++) {
                    tableMarkdown += " :" + "-".repeat(cellSpaces - 4) + ": |";
                }
                tableMarkdown += "\n";

                //// body
                for (let r = 0; r < rowCount; r++) {
                    tableMarkdown += "|";
                    for (let c = 0; c < colCount; c++) {
                        tableMarkdown += " ".repeat(cellSpaces) + "|";
                    }
                    tableMarkdown += "\n";
                }

                window.dialogReturn(tableMarkdown);
            });
        })();
    </script>
</body>
</html>
