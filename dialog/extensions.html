<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="dialog-prefered-width" content="800">
    <meta name="dialog-prefered-height" content="650">
    <meta name="dialog-toolbar-left" content="<button class='icon-button' id='import-extension-btn' title='Import extension' data-locale-attr='title:dialogs.extensions.import'>add_box</button>">
    <meta name="dialog-toolbar-right" content="<button class='icon-button' id='upgrade-all-btn' title='Update all extensions' data-locale-attr='title:dialogs.extensions.upgrade-all'>update</button>">

    <style>
        .extensions-container {
            display: flex;
            flex-direction: column;
            height: 100%;
            padding-top: 48px;
        }

        .extensions-list {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 1px;
        }

        .extension-item {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 0 8px 0 8px;
            border: none;
            background-color: var(--background-color-2);
            color: var(--text-color);
            border-bottom: 1px solid var(--background-color-1);
        }

        .extension-item:first-child {
            border-radius: 12px 12px 0 0;
            margin: 8px 8px 0 8px;
            border-bottom: 1px solid var(--background-color-1);
            border-left: 1px solid var(--background-color-1);
            border-right: 1px solid var(--background-color-1);
            border-top: 1px solid var(--background-color-1);
        }

        .extension-item:last-child {
            border-radius: 0 0 12px 12px;
            margin: 0 8px 8px 8px;
            border-bottom: 1px solid var(--background-color-1);
            border-left: 1px solid var(--background-color-1);
            border-right: 1px solid var(--background-color-1);
        }

        .extension-item:only-child {
            border-radius: 12px;
            margin: 8px;
            border: 1px solid var(--background-color-1);
        }

        .extension-icon {
            margin: 5px 0px 5px 5px;
            font-size: 28px;
            min-width: 48px;
            min-height: 48px;
            max-width: 48px;
            max-height: 48px;
            text-align: center;
            font-family: "Material Symbols Rounded";
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 7px;
            user-select: none;
        }

        .extension-info {
            flex: 1;
            min-width: 0;
            user-select: none;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .extension-header {
            display: flex;
            align-items: baseline;
            gap: 8px;
            margin-bottom: 4px;
        }

        .extension-title {
            font-weight: 500;
            font-size: 0.95rem;
            color: var(--text-color);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .extension-version {
            font-size: 0.75rem;
            color: var(--subtle-color);
            padding: 2px 6px;
            background-color: var(--background-color-1);
            border-radius: 3px;
        }

        .extension-author {
            font-size: 0.8rem;
            color: var(--subtle-color);
        }

        .extension-docs-link {
            font-size: 0.8rem;
            color: var(--link-color);
            margin-left: 8px;
        }

        .extension-actions {
            display: flex;
            gap: 6px;
            margin-left: 12px;
            margin-right: 12px;
        }

        .action-btn {
            border: none;
            background: none;
            padding: 4px 8px;
            border-radius: 8px;
            transition: all 0.2s;
            font-size: 18px;
            min-width: 32px;
            min-height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .action-btn:hover {
            background-color: var(--hover-color);
            color: var(--text-color);
        }

        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 40px 20px;
            text-align: center;
            user-select: none;
        }

        .empty-state-icon {
            font-size: 48px;
            font-family: "Material Symbols Rounded";
        }

        .empty-state-text {
            font-size: 0.95rem;
            color: var(--subtle-color);
        }
    </style>
</head>
<body>
    <section class="extensions-container">
        <div class="extensions-list" id="extensions-list"></div>
    </section>

    <script>
        (() => {
            const extensionsList = document.getElementById("extensions-list");
            const importExtensionBtn = document.getElementById("import-extension-btn");
            const upgradeAllBtn = document.getElementById("upgrade-all-btn");

            let extensions = [];

            const renderList = () => {
                extensionsList.innerHTML = "";

                if (extensions.length === 0) {
                    extensionsList.innerHTML = `
                        <div class="empty-state">
                            <div class="empty-state-icon">extension</div>
                            <div class="empty-state-text">No extensions installed</div>
                        </div>
                    `;
                    return;
                }

                extensions.forEach((ext, index) => {
                    const item = document.createElement("div");
                    item.className = "extension-item";

                    const iconColor = ext.color || "var(--text-color)";
                    const iconEl = document.createElement("span");
                    iconEl.className = "extension-icon";
                    iconEl.style.color = iconColor;
                    iconEl.style.backgroundColor = `color-mix(in srgb, ${iconColor} 20%, transparent)`;
                    iconEl.textContent = ext.icon || "extension";
                    iconEl.setAttribute("translate", "no");
                    item.appendChild(iconEl);

                    const infoEl = document.createElement("div");
                    infoEl.className = "extension-info";
                    infoEl.id = `extension-info-${index}`;
                    infoEl.innerHTML = `
                        <div class="extension-header">
                            <span class="extension-title">${ext.title || "Untitled Extension"}</span>
                        </div>
                        <div>
                            ${ext.author ? `<span class="extension-author">by ${ext.author}</span>` : ""}
                            ${ext.version ? `<span class="extension-version">v${ext.version}</span>` : ""}
                            ${ext.documentationLink ? `<a href="${ext.documentationLink}" target="_blank" class="extension-docs-link">Documentation</a>` : ""}
                        </div>
                    `;
                    item.appendChild(infoEl);

                    const actionsEl = document.createElement("div");
                    actionsEl.className = "extension-actions";
                    actionsEl.innerHTML = `
                        <div class="dropdown extension-dropdown">
                            <button class="icon-button" translate="no" onmousedown="toggleDropdown('${index}-menu')">more_vert</button>
                            <div class="dropdown-content menu" id="${index}-menu">
                                <button class="text-button" data-ext-edit-id="${index}">Edit code</button>
                                ${ext.updateLink ? `<button class="text-button" data-ext-upgrade-id="${index}">Update</button>` : ""}
                                <hr>
                                <button class="text-button" data-ext-download-id="${index}">Download file</button>
                                <hr>
                                <button class="text-button danger" data-ext-delete-id="${index}">Delete</button>
                            </div>
                        </div>
                    `;
                    item.appendChild(actionsEl);

                    infoEl.addEventListener("dblclick", async () => {
                        hideAllMenus();
                        await openExtensionEditor(index);
                    });
                    iconEl.addEventListener("dblclick", async () => {
                        hideAllMenus();
                        await openExtensionEditor(index);
                    });

                    const editBtn = actionsEl.querySelector(`[data-ext-edit-id="${index}"]`);
                    editBtn.addEventListener("mouseup", async () => {
                        hideAllMenus();
                        await openExtensionEditor(index);
                    });
                    const upgradeBtn = actionsEl.querySelector(`[data-ext-upgrade-id="${index}"]`);
                    if (upgradeBtn) {
                        upgradeBtn.addEventListener("mouseup", async () => {
                            hideAllMenus();
                            const result = await Extensions.upgradeFromLink(index);
                            if (result.updated) {
                                toast.show(`Updated to v${result.newVersion}`, "check");
                            } else {
                                toast.show(result.reason || result.error || "Update failed", "error");
                            }
                            await loadExtensions();
                        });
                    }
                    const downloadBtn = actionsEl.querySelector(`[data-ext-download-id="${index}"]`);
                    downloadBtn.addEventListener("mouseup", async () => {
                        hideAllMenus();
                        await Extensions.export(index);
                    });
                    const deleteBtn = actionsEl.querySelector(`[data-ext-delete-id="${index}"]`);
                    deleteBtn.addEventListener("mouseup", async () => {
                        hideAllMenus();
                        
                        const confirmDelete = await showConfirmDialog({
                            message: `Delete "${ext.title}"?`,
                            detail: "This action cannot be undone.",
                            denyButtonText: getTranslation("common.cancel", "Cancel"),
                            confirmButtonText: getTranslation("common.delete", "Delete"),
                            confirmButtonDestructive: true,
                        });

                        if (!confirmDelete) return;

                        await Extensions.delete(index);
                        await loadExtensions();
                    });


                    extensionsList.appendChild(item);
                });
            };

            const loadExtensions = async () => {
                extensions = await Extensions.getAll();
                renderList();
            };

            const openExtensionEditor = async (index) => {
                const ext = index !== undefined ? await Extensions.get(index) : null;
                const code = ext?.code || `/**
 * @extension
 * @title New Extension
 * @author 
 * @version 0.1.0
 * @description 
 * @documentationLink 
 * @updateLink 
 * @icon extension
 * @color 
 */

// Your extension code here
`;

                const result = await showTextEditorDialog({
                    value: code,
                    mode: "javascript",
                });

                // Check if user confirmed the edit
                if (!result?.confirmed || !result?.value) {
                    return;
                }

                const codeString = result.value.trim();

                if (codeString.length > 0) {
                    try {
                        if (index !== undefined) {
                            await Extensions.update(index, codeString);
                            toast.show("Extension updated", "check");
                        } else {
                            await Extensions.import(codeString);
                            toast.show("Extension created", "check");
                        }
                        await loadExtensions();
                    } catch (err) {
                        toast.show(err.message || "Error saving extension", "error");
                    }
                }
            };

            importExtensionBtn.addEventListener("click", async () => {
                const code = await Extensions.pickFile();
                if (code) {
                    await Extensions.import(code);
                    await loadExtensions();
                    toast.show("Extension imported", "check");
                }
            });

            upgradeAllBtn.addEventListener("click", async () => {
                const results = await Extensions.upgradeAllFromLinks();
                
                let message = "";
                let updated = 0;
                for (const result of results) {
                    if (result.updated) {
                        updated++;
                    }
                }

                if (updated === 0) {
                    toast.show("All extensions are up to date", "info");
                } else {
                    toast.show(`${updated} extension(s) updated`, "check");
                }

                await loadExtensions();
            });

            loadExtensions();
        })();
    </script>
</body>
</html>
