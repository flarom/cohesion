<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cohesion</title>
    <meta name="dialog-prefered-width" content="400">
    <meta name="dialog-prefered-height" content="444">
    <style>
        .version-span {
            font-size: 0.9em;
            background-color: var(--selection-color);
            color: var(--accent);
            padding: 6px 12px;
            border-radius: 999px;
        }
    </style>
</head>
<body>
    <div id="dialog-page-main" class="dialog-page active">
        <div class="padding" style="text-align: center; user-select: none;">
            <img src="./static/favicon.svg" alt="">
            <h2>Cohesion</h2>
            <span class="version-span">2.1.0</span>
        </div>
        <main class="padding">
            <section>
                <button class="row" onclick="xToggleDialogPage('details', 'Details')">
                    <label>Details</label>
                    <span class="icon">chevron_forward</span>
                </button>
            </section>
            <section>
                <button class="row" onclick="window.open('https://github.com/flarom/cohesion/issues')">
                    <label>Report an Issue</label>
                    <span class="icon">open_in_new</span>
                </button>
            </section>
            <section>
                <button class="row" onclick="xToggleDialogPage('credits', 'Credits')">
                    <label>Credits</label>
                    <span class="icon">chevron_forward</span>
                </button>
                <button class="row" onclick="xToggleDialogPage('legal', 'Legal warning')">
                    <label>Legal warning</label>
                    <span class="icon">chevron_forward</span>
                </button>
            </section>
        </main>
    </div>
    <div id="dialog-page-details" class="dialog-page">
        <hr class="toolbar-spacer">
        <main class="padding">
            <!-- <section>
                <button class="row" onclick="toggleDialogPage('main')">
                    <span class="icon">chevron_backward</span>
                    <label>Back</label>
                </button>
            </section> -->
            <section>
                <button class="row" onclick="window.open('https://github.com/flarom/cohesion')">
                    <label>GitHub repository</label>
                    <span class="icon">open_in_new</span>
                </button>
                <button class="row" onclick="window.open('https://ko-fi.com/flarom')">
                    <label>Donate</label>
                    <span class="icon">open_in_new</span>
                </button>
                <button class="row" onclick="window.open('https://github.com/flarom/cohesion/wiki/Translating')">
                    <label>Translate</label>
                    <span class="icon">open_in_new</span>
                </button>
            </section>
        </main>
    </div>

    </div>

        <hr class="toolbar-spacer">
        <main class="padding">

                <button class="row" onclick="toggleDialogPage('main')">

            </section>
        </main>
    </div>

    <script>
        function xToggleDialogPage(pageId, title) {
            toggleDialogPage(pageId);
            if (pageId === 'main') {
                updateDialogToolbarLeft('');
                updateDialogToolbarCenter('');
            } else {
                updateDialogToolbarLeft(`<button class=icon-button onclick='xToggleDialogPage("main")' translate=no title='Back'>chevron_backward</button>`);
                updateDialogToolbarCenter(title);
            }
        }
    </script>
</body>
</html>
